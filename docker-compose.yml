version: '3.5'
services:
  nl2e:
    build: ./Docker/nl2e
    container_name: nl2e
    depends_on:
      - mysql
    environment:
      DISPLAY: ${DISPLAY}
    volumes:
      - ./KHCoder:/KHCoder
      - ${HOME}/.Xauthority:/root/.Xauthority
    network_mode: host
  mysql:
    image: 'sinby/mysql-for-khcoder:8.0.27'
    cap_add:
      - SYS_NICE
    environment:
        MYSQL_ROOT_PASSWORD: 'khcoder'
    ports:
      - '13306:3306'
    volumes:
      - ./db_data:/var/lib/mysql

volumes:
    KHCoder:
    db_data:
